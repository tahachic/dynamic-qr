
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Opening destination...</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f7fb;
            color: #222;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 25px;
            background: #1877F2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2 id="title">Opening destination...</h2>
    <p id="message">Please wait while we redirect you.</p>
    <a id="fallbackLink" href="#">Continue to website</a>
</div>

<script>

// ============================================
// 1. CHANGE ONLY THIS URL WHENEVER YOU WANT
// ============================================

const DESTINATION = "https://www.youtube.com/@Raklita";


// ============================================
// 2. PLATFORM DETECTION
// ============================================

function detectPlatform(url) {

    const host = url.hostname.toLowerCase();

    if (host === "facebook.com" || host.endsWith(".facebook.com") ||
        host === "fb.com") return "facebook";

    if (host === "youtube.com" || host.endsWith(".youtube.com") ||
        host === "youtu.be") return "youtube";

    if (host === "instagram.com" || host.endsWith(".instagram.com"))
        return "instagram";

    if (host === "whatsapp.com" || host.endsWith(".whatsapp.com") ||
        host === "wa.me") return "whatsapp";

    return "website";
}


// ============================================
// 3. CREATE APP DESTINATION
// ============================================

function getAppTarget(platform, url) {

    const encodedURL = encodeURIComponent(url.href);

    switch (platform) {

        case "facebook":
            return {
                android: "com.facebook.katana",
                ios: "fb://facewebmodal/f?href=" + encodedURL
            };

        case "youtube":
            return {
                android: "com.google.android.youtube",
                ios: "youtube://" + url.host + url.pathname +
                     url.search + url.hash
            };

        case "instagram": {

            const match = url.pathname.match(/^\/([a-zA-Z0-9._]+)\/?$/);

            return {
                android: "com.instagram.android",
                ios: match
                    ? "instagram://user?username=" + match[1]
                    : null
            };
        }

        case "whatsapp": {

            const phone = url.hostname === "wa.me"
                ? url.pathname.replace(/\//g, "")
                : url.searchParams.get("phone");

            if (phone) {
                return {
                    android: "com.whatsapp",
                    ios: "whatsapp://send?phone=" +
                         encodeURIComponent(phone)
                };
            }

            return {
                android: "com.whatsapp",
                ios: "whatsapp://"
            };
        }

        default:
            return null;
    }
}


// ============================================
// 4. MAIN REDIRECTION ENGINE
// ============================================

const url = new URL(DESTINATION);

if (url.protocol !== "https:") {
    throw new Error("Only HTTPS destinations are supported.");
}

const platform = detectPlatform(url);

const app = getAppTarget(platform, url);

document.title = "Opening " + platform;

document.getElementById("title").textContent =
    "Opening " + platform.charAt(0).toUpperCase() +
    platform.slice(1) + "...";

document.getElementById("fallbackLink").href = DESTINATION;

document.getElementById("fallbackLink").textContent =
    "Continue to " + platform;


// ============================================
// 5. DEVICE DETECTION
// ============================================

const ua = navigator.userAgent || "";

const isAndroid = /Android/i.test(ua);

const isIOS =
    /iPhone|iPad|iPod/i.test(ua) ||
    (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);


// ============================================
// 6. FALLBACK MANAGEMENT
// ============================================

let fallbackTimer;

function openWebsite() {
    if (!document.hidden) {
        window.location.replace(DESTINATION);
    }
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        clearTimeout(fallbackTimer);
    }
});

window.addEventListener("pagehide", () => {
    clearTimeout(fallbackTimer);
});


// ============================================
// 7. ANDROID APP LAUNCH
// ============================================

if (isAndroid && app && app.android) {

    const intent =
        "intent://" + url.host + url.pathname +
        url.search + url.hash +
        "#Intent;scheme=https;" +
        "package=" + app.android + ";" +
        "S.browser_fallback_url=" +
        encodeURIComponent(DESTINATION) +
        ";end";

    fallbackTimer = setTimeout(openWebsite, 2500);

    window.location.href = intent;

}


// ============================================
// 8. IPHONE APP LAUNCH
// ============================================

else if (isIOS && app && app.ios) {

    fallbackTimer = setTimeout(openWebsite, 2200);

    window.location.href = app.ios;

}


// ============================================
// 9. UNKNOWN APP / WEBSITE / DESKTOP
// ============================================

else {

    openWebsite();

}

</script>

</body>
</html>
