<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Redirecting...</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
            color: #333;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        a {
            color: #1877F2;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Redirecting...</h2>
    <p>Please wait while we open your destination.</p>
    <p>
        <a id="manualLink" href="#">Click here if you are not redirected.</a>
    </p>
</div>

<script>
(async function () {

    try {

        // Load destination from config.json
        const response = await fetch("/config.json?t=" + Date.now(), {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Unable to load configuration.");
        }

        const config = await response.json();

        const destination = config.destination;

        // Validate destination
        const url = new URL(destination);

        if (!["http:", "https:"].includes(url.protocol)) {
            throw new Error("Invalid destination URL.");
        }

        // Provide a manual link as fallback
        const manualLink = document.getElementById("manualLink");
        manualLink.href = destination;

        // Let iOS and Android handle HTTPS app links.
        // This avoids forcing Facebook's app to open its home page.
        window.location.replace(destination);

    } catch (error) {

        console.error("Redirect error:", error);

        document.querySelector(".container").innerHTML = `
            <h2>Unable to redirect</h2>
            <p>Please try again later.</p>
        `;

    }

})();
</script>

</body>
</html>
